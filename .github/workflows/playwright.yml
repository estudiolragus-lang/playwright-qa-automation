name: Playwright Tests

# Corre toda la suite en cada cambio subido a main, en cada pull request,
# y también a mano desde la pestaña "Actions".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar el navegador
        run: npx playwright install --with-deps chromium

      - name: Correr los tests
        run: npx playwright test

      # Guarda el reporte HTML aunque los tests fallen, para poder revisarlo
      - name: Guardar el reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
